application:
  subdomain: one-api
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://one-api:3000/

services:
  one-api:
    # upstream: docker.io/justsong/one-api:v0.6.10
    image: docker.1ms.run/justsong/one-api:v0.6.10
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    binds:
      - /lzcapp/var/data:/data

usage: |
  One API 把各家大模型统一成 OpenAI 兼容接口：添加渠道、生成令牌，
  再把 base_url 指向本应用即可。默认管理员 root，密码 123456，
  首次登录后请立即修改密码。
